<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مسح Firebase - بيمبو ستور</title>
<style>
body{font-family:Tahoma,Arial; background:#f8fafc; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0}
.card{background:#fff; border:1px solid #e2e8f0; border-radius:1rem; padding:2rem; max-width:400px; width:90%; text-align:center; box-shadow:0 10px 20px rgba(0,0,0,.1)}
button{background:#ef4444; color:#fff; border:none; border-radius:.6rem; padding:.8rem 1.5rem; font-weight:800; cursor:pointer; font-size:1rem; width:100%; margin-top:1rem}
button.ok{background:#16a34a}
button:disabled{opacity:.5; cursor:not-allowed}
input[type=password]{width:100%; box-sizing:border-box; padding:.7rem; border:1px solid #cbd5e1; border-radius:.6rem; font-size:1rem; margin-top:.75rem; text-align:center; font-family:Tahoma,Arial}
pre{font-size:.7rem; text-align:left; direction:ltr; background:#f1f5f9; padding:.5rem; border-radius:.5rem; overflow:auto}
</style>
</head>
<body>
<div class="card">
<h2>🔥 مسح Firebase نهائي</h2>
<p style="font-size:.85rem;color:#475569">الزر ده هيمسح كل بيانات الجرد من قاعدة البيانات <b>jard</b> نهائياً من Firebase. استخدمه لو المسح من البرنامج مش بيسمع.</p>
<p style="font-size:.8rem;color:#b91c1c;font-weight:700">🔒 الصفحة دي محمية — لازم باسورد الأدمن نفسه المستخدم في البرنامج.</p>
<input type="password" id="pw" placeholder="باسورد الأدمن">
<pre id="log">جاهز...</pre>
<button id="wipeBtn" disabled>💥 امسح كل بيانات الجرد من Firebase الآن</button>
<button class="ok" onclick="location.href='./'">↩️ رجوع للبرنامج</button>
</div>
<script>
const DB_URL = 'https://jard-86baf-default-rtdb.firebaseio.com/jard';
const logEl = document.getElementById('log');
const pwEl = document.getElementById('pw');
const btn = document.getElementById('wipeBtn');
function log(t){ logEl.textContent += '\n' + t; console.log(t); }
async function hashPass(p){
  try {
    if (crypto && crypto.subtle) {
      const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('bjrd::' + p));
      return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) {}
  let h = 5381; const s = 'bjrd::' + p;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
  return 'fb' + h.toString(16);
}
async function checkPass(){
  const p = pwEl.value || '';
  btn.disabled = true;
  if (!p) return;
  try {
    const r = await fetch(DB_URL + '/meta/adminHash.json');
    const remoteHash = await r.json();
    const h = await hashPass(p);
    const DEFAULT_HASH = await hashPass('123456');
    /* لو الأدمن لسه ما غيّرش باسوردة، الافتراضي شغال؛ غير كده لازم الباسورد الحقيقي بالظبط */
    const ok = remoteHash ? (h === remoteHash) : (h === DEFAULT_HASH);
    btn.disabled = !ok;
  } catch (e) {
    btn.disabled = true;
  }
}
pwEl.addEventListener('input', checkPass);
pwEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !btn.disabled) btn.click(); });
document.getElementById('wipeBtn').onclick = async ()=>{
  if (!confirm('متأكد هتمسح كل بيانات الجرد من Firebase نهائياً؟')) return;
  log('جاري المسح...');
  try {
    // مسح data
    let r = await fetch(DB_URL + '/data.json', { method: 'DELETE' });
    log('مسح data: ' + r.status);
    // مسح notifs
    r = await fetch(DB_URL + '/notifs.json', { method: 'DELETE' });
    log('مسح notifs: ' + r.status);
    // مسح sessions
    r = await fetch(DB_URL + '/sessions.json', { method: 'DELETE' });
    log('مسح sessions: ' + r.status);
    // كتابة ختم مسح
    const wipeTs = Date.now();
    r = await fetch(DB_URL + '/meta/lastWipeRev.json', { method: 'PUT', body: JSON.stringify(wipeTs) });
    log('ختم المسح: ' + r.status + ' ts=' + wipeTs);
    r = await fetch(DB_URL + '/meta/lastWipe.json', { method: 'PUT', body: JSON.stringify(wipeTs) });
    log('ختم المسح 2: ' + r.status);
    // مسح كاش الـ Service Worker (مفيش أي تخزين محلي دائم في البرنامج أصلاً)
    try { if ('caches' in window) { const ks = await caches.keys(); for (const k of ks) if (k.startsWith('jard-')) await caches.delete(k); } } catch(e){}
    log('✅ تم المسح النهائي - افتح البرنامج الآن فاضي');
    alert('✅ اتمسح كل شيء من Firebase - البرنامج دلوقتي فاضي');
  } catch(e){
    log('❌ خطأ: ' + e.message);
    alert('خطأ: ' + e.message);
  }
};
</script>
